app = "aternos-247-bot"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  HEADLESS = "true"
  CHECK_INTERVAL = "5.0"
  COUNTDOWN_THRESHOLD = "180"
  EMERGENCY_THRESHOLD = "30"
  MOCK_MODE = "false"
  AUTO_START_ON_OFFLINE = "false"
  AUTO_CONFIRM_QUEUE = "true"
  LOG_LEVEL = "INFO"
  COOKIE_FILE_PATH = "/app/data/cookies.json"
  SCREENSHOT_DIR = "/app/data/screenshots"

[[mounts]]
  source = "aternos_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
